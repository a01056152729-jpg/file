<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>불꽃놀이</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #03040a;
  }
  body {
    background: radial-gradient(ellipse at 50% 100%, #1b2250 0%, #0a0d24 45%, #03040a 100%);
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  h1 {
    position: fixed;
    top: 8%;
    left: 0;
    right: 0;
    margin: 0;
    text-align: center;
    color: #fff;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    font-size: clamp(2.2rem, 10vw, 4.8rem);
    letter-spacing: 0.15em;
    text-shadow: 0 0 12px rgba(255, 220, 150, 0.8), 0 0 32px rgba(255, 150, 80, 0.5);
    pointer-events: none;
  }
  .hint {
    position: fixed;
    bottom: 6%;
    left: 0;
    right: 0;
    text-align: center;
    color: rgba(255, 255, 255, 0.6);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    font-size: clamp(0.9rem, 3.5vw, 1.2rem);
    pointer-events: none;
    transition: opacity 1s;
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<h1>불꽃놀이</h1>
<div class="hint" id="hint">화면을 터치하거나 클릭해 보세요</div>

<script>
(function () {
  var canvas = document.getElementById('sky');
  var ctx = canvas.getContext('2d');
  var hint = document.getElementById('hint');
  var particles = [];
  var dpr = 1, w = 0, h = 0;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function burst(x, y) {
    var count = 90 + Math.floor(Math.random() * 50);
    var baseHue = Math.random() * 360;
    var multi = Math.random() < 0.5;
    for (var i = 0; i < count; i++) {
      var angle = Math.random() * Math.PI * 2;
      var speed = Math.random() * 5 + 1.5;
      var hue = multi ? Math.random() * 360 : baseHue + (Math.random() * 40 - 20);
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: Math.random() * 2 + 1.2,
        hue: hue,
        life: 1,
        decay: Math.random() * 0.012 + 0.008
      });
    }
  }

  function onPointer(e) {
    e.preventDefault();
    burst(e.clientX, e.clientY);
    hint.style.opacity = 0;
  }
  canvas.addEventListener('pointerdown', onPointer);

  function loop() {
    // 잔상 효과: 이전 프레임을 조금씩 지웁니다
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
    ctx.fillRect(0, 0, w, h);

    ctx.globalCompositeOperation = 'lighter';
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.vx *= 0.985;
      p.vy *= 0.985;
      p.vy += 0.06;
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      ctx.beginPath();
      ctx.fillStyle = 'hsla(' + p.hue + ', 100%, 60%, ' + p.life + ')';
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
